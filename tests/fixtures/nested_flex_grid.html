<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Nested Flex and Grid Layout</title>
  <style>
    body {
      margin: 0;
      padding: 16px;
      background-color: #1a1a24;
      color: #ffffff;
      font-family: sans-serif;
    }
    .grid-container {
      display: grid;
      grid-template-columns: 200px 1fr 200px;
      gap: 16px;
      width: 1000px;
      min-height: 600px;
      background-color: #242436;
      border: 2px solid #383854;
      padding: 16px;
    }
    .grid-item {
      background-color: #2f2f48;
      border-radius: 4px;
      padding: 12px;
    }
    .flex-column {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
    }
    .flex-row {
      display: flex;
      flex-direction: row;
      justify-content: space-around;
      align-items: center;
      background-color: #3b3b5c;
      padding: 8px;
      border-radius: 4px;
    }
    .card {
      background-color: #484870;
      padding: 8px 16px;
      border-radius: 4px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="grid-container">
    <div class="grid-item flex-column">
      <h3>Sidebar Navigation</h3>
      <div class="card">Item 1</div>
      <div class="card">Item 2</div>
      <div class="card">Item 3</div>
    </div>
    <div class="grid-item flex-column">
      <h2>Main Content Canvas</h2>
      <div class="flex-row">
        <div class="card">Widget Alpha</div>
        <div class="card">Widget Beta</div>
        <div class="card">Widget Gamma</div>
      </div>
      <p>Independent rendering engine layout demonstration.</p>
    </div>
    <div class="grid-item flex-column">
      <h3>Inspector Panel</h3>
      <div class="card">Metrics</div>
      <div class="card">Network</div>
    </div>
  </div>
</body>
</html>
